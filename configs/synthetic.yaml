data:
  K: 8
  L: 32
  n_train: 10000
  n_val: 2000

model:
  hidden_dim: 128
  num_layers: 3
  time_embed_dim: 64

training:
  epochs: 100
  lr: 0.001
  batch_size: 256
  flow_type: ctmc

guidance:
  gamma: 1.0
  num_steps: 100
  num_samples: 1000

properties:
  - name: starts_with_0
    description: "sequence[0] == 0"
  - name: contains_pattern
    description: "subsequence [1,2,3] appears somewhere"
  - name: no_repeats
    description: "no two adjacent positions share same value"
